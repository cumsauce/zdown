# Copy to config.toml and fill in. See docs/OAUTH.md.

[server]
host = "127.0.0.1"
port = 3000
# openssl rand -hex 32
secret_key = "CHANGE_ME"
data_dir = "./data"          # bare mirror repos + sqlite live here
public_origin = "http://localhost:5175"
# public_dir = "/app/public" # built frontend; default ./public (or next to the binary)
# dev_auto_login = true      # DEV ONLY: any browser acts as the first seeded
#                            # user — no login needed. Never enable in production.

[providers.github]
client_id = ""
client_secret = ""

# [providers.gitlab]
# client_id = ""
# client_secret = ""
# base_url = "https://gitlab.example.com"   # self-hosted; default https://gitlab.com

# Site-wide access control. Both are optional and both are ignored when
# dev_auto_login is on.
# [access]
# password = ""          # shared password for the whole site (or env MD_EDITOR_GATE_PASSWORD)
# allowed_users = ["github:you", "gitlab:you"]   # who may sign in; empty = anyone
